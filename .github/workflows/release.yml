name: 'Release: Build & Package App'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'Tag name for release (e.g. v1.8.29)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pre-release gate: ensure version numbers are consistent across
  # package.json, tauri.conf.json and Cargo.toml before kicking off
  # the expensive multi-platform build matrix.
  version-sync-check:
    name: Verify version sync
    runs-on: ubuntu-latest
    outputs:
      resolved-tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag-name || github.ref_name }}

      - name: Resolve tag name
        id: resolve-tag
        shell: bash
        run: |
          # For workflow_dispatch use the input, for tag push use the ref name
          TAG="${{ inputs.tag-name || github.ref_name }}"
          # Strip leading refs/tags/ if present
          TAG="${TAG#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"

      - name: Check version consistency
        shell: bash
        run: |
          set -euo pipefail
          pkg_version="$(node -e "console.log(require('./package.json').version)")"
          tauri_version="$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); console.log(c.version || '')")"
          cargo_version="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/')"
          rust_edition="$(grep -m1 '^edition' src-tauri/Cargo.toml | sed -E 's/^edition[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/')"
          rust_minver="$(grep -m1 '^rust-version' src-tauri/Cargo.toml | sed -E 's/^rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/')"
          toolchain_channel=""
          if [[ -f rust-toolchain.toml ]]; then
            toolchain_channel="$(grep -m1 'channel' rust-toolchain.toml | sed -E 's/.*channel[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/')"
          elif [[ -f rust-toolchain ]]; then
            toolchain_channel="$(head -n1 rust-toolchain | tr -d '[:space:]')"
          fi
          echo "package.json:      ${pkg_version}"
          echo "tauri.conf.json:   ${tauri_version}"
          echo "Cargo.toml:        ${cargo_version}"
          echo "rust-edition:      ${rust_edition}"
          echo "rust-version:      ${rust_minver}"
          echo "rust-toolchain:    ${toolchain_channel}"

          android_props_file="src-tauri/gen/android/app/tauri.properties"
          if [[ -f "$android_props_file" ]]; then
            android_version_name="$(grep 'tauri.android.versionName' "$android_props_file" | cut -d'=' -f2 | tr -d ' ')"
            echo "Android version:   ${android_version_name}"
            if [[ "$pkg_version" != "$android_version_name" ]]; then
              echo "::error::Android version mismatch: ${android_version_name} != ${pkg_version}"
              exit 1
            fi
          else
            echo "::warning::Android tauri.properties not found; skipping Android version check."
          fi

          # Rust toolchain cross-check: the repo's locked toolchain MUST match what
          # CI installs and what Cargo.toml declares as the minimum MSRV.
          if [[ -n "${rust_minver}" && -n "${toolchain_channel}" ]]; then
            if [[ "${rust_minver}" != "${toolchain_channel}" ]]; then
              echo "::error::Rust version mismatch: Cargo.toml rust-version=${rust_minver} != rust-toolchain.toml channel=${toolchain_channel}"
              exit 1
            fi
          fi

          # Edition 2024 requires Rust >= 1.85.0. Guard against downgrade drift.
          if [[ "${rust_edition}" == "2024" ]]; then
            req_major="${toolchain_channel%%.*}"; req_major="${req_major:-0}"
            req_minor="${toolchain_channel#*.}"; req_minor="${req_minor%%.*}"; req_minor="${req_minor:-0}"
            if (( req_major < 1 || (req_major == 1 && req_minor < 85) )); then
              echo "::error::Edition 2024 requires rust-toolchain >= 1.85.0, got ${toolchain_channel}"
              exit 1
            fi
          fi

          if [[ "$pkg_version" != "$tauri_version" ]] || [[ "$pkg_version" != "$cargo_version" ]]; then
            echo "::error::Version mismatch detected. All three files must have the same version."
            exit 1
          fi

          # Cross-check: the resolved tag (without leading v) MUST equal the
          # in-repo version. Without this, a workflow_dispatch with a wrong
          # tag-name input would publish assets under a mismatched release.
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          TAG_VERSION="${TAG#v}"
          if [[ -n "$TAG_VERSION" && "$TAG_VERSION" != "$pkg_version" ]]; then
            echo "::error::Tag/version mismatch: tag '${TAG}' (v${TAG_VERSION}) != repo version ${pkg_version}"
            exit 1
          fi
          echo "::notice::All version sources are in sync: v${pkg_version} (toolchain=${toolchain_channel:-n/a}, edition=${rust_edition}, tag=${TAG})"

  release:
    needs: version-sync-check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - platform: 'windows-latest'
            build-args: '--bundles nsis'
            target: ''
            asset-prefix: '01'
          # Windows ARM64 (native build on ARM runner)
          - platform: 'windows-11-arm'
            build-args: '--bundles nsis'
            target: ''
            asset-prefix: '01_arm'
          # macOS Apple Silicon (M1/M2/M3)
          - platform: 'macos-14'
            build-args: ''
            target: aarch64-apple-darwin
            asset-prefix: '02'
          # macOS Intel (cross-compile on Apple Silicon runner)
          # macos-13 runners are scarce; macos-14 (M1+) can cross-compile
          # x86_64-apple-darwin reliably with Rust's --target flag.
          - platform: 'macos-14'
            build-args: ''
            target: x86_64-apple-darwin
            asset-prefix: '02_intel'
          # Ubuntu x64
          - platform: 'ubuntu-22.04'
            build-args: ''
            target: ''
            asset-prefix: '03'
          # Ubuntu 24.04 x64
          - platform: 'ubuntu-24.04'
            build-args: ''
            target: ''
            asset-prefix: '03_24'
          # Android ARM64
          - platform: 'ubuntu-latest'
            mobile: 'android'
            target: 'aarch64-linux-android'
            build-args: ''
            asset-prefix: '04'
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ github.event.release.id || '' }}
      tag-name: ${{ needs.version-sync-check.outputs.resolved-tag }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.build-args }}
      asset-name-pattern: '[name]_v[version]_[platform]_[arch][ext]'
      asset-prefix: ${{ matrix.asset-prefix }}
      mobile: ${{ matrix.mobile }}
      upload-artifacts: false
      ref: ${{ needs.version-sync-check.outputs.resolved-tag }}
    secrets: inherit
    permissions:
      contents: write
      actions: write

  release-verify:
    name: Verify Release Assets
    needs: [version-sync-check, release]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Wait for release assets to settle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.version-sync-check.outputs.resolved-tag }}"
          echo "Waiting for release assets for tag: $tag"
          for i in $(seq 1 30); do
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release found"
              break
            fi
            if [[ $i -eq 30 ]]; then
              echo "::error::Release not found after waiting"
              exit 1
            fi
            sleep 10
          done

      - name: Verify expected assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.version-sync-check.outputs.resolved-tag }}"
          echo "Checking release assets for $tag"
          assets=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          echo "Found assets:"
          echo "$assets"

          expected_prefixes=(
            "01_"
            "01_arm_"
            "02_"
            "02_intel_"
            "03_"
            "03_24_"
            "04_"
          )

          missing=0
          for prefix in "${expected_prefixes[@]}"; do
            if echo "$assets" | grep -q "^${prefix}"; then
              echo "OK: Found assets with prefix ${prefix}"
            else
              echo "::warning::Missing assets with prefix ${prefix}"
              missing=$((missing + 1))
            fi
          done

          if [[ "$missing" -gt 0 ]]; then
            echo "::notice::Some expected asset prefixes were missing (${missing}). This may be normal if the build is still in progress or if some platforms were intentionally skipped."
          fi

          total=$(echo "$assets" | wc -l)
          if [[ "$total" -eq 0 ]]; then
            echo "::error::No assets found in release"
            exit 1
          fi
          echo "Release verification complete. Found $total asset(s)."
